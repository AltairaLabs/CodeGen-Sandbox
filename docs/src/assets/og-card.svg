      <stop offset="0%" stop-color="#0A1120"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#7DD3A8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7DD3A8" stop-opacity="0"/>
