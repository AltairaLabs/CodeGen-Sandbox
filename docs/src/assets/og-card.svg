  <text x="96" y="502" font-family="Space Grotesk" font-weight="400" font-size="26" fill="#7DD3A8" opacity="0.85">Read · Edit · Grep · Bash · run_tests · run_lint — over MCP, in a container</text>

  <rect x="96" y="548" width="96" height="4" rx="2" fill="#E3B341"/>

