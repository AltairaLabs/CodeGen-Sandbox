version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    # revive runs its default rule set, which includes `exported` (doc
    # comments on exported identifiers) plus ~20 more. Do not pin an
    # explicit `rules:` list here — that replaces the defaults wholesale
    # and silently narrows coverage.
    - revive

formatters:
  enable:
    - gofmt
